<body>

<div class="page">

<div class="card">

<img class="logo" src="لوكو.png" alt="الأمير للفضيات">

<h1>الأمير للفضيات</h1>

<div class="subtitle">
أهلاً وسهلاً بكم 🌹<br>
لتثبيت طلبكم، يرجى تعبئة المعلومات التالية بدقة.
</div>

<div class="gold-line"></div>

<div class="badge">جودة عالية 💎</div>
<div class="badge">توصيل 🚚</div>
</div>

<form id="orderForm">

<label>👤 الاسم الكامل</label>
<input type="text" id="name" placeholder="اكتب اسمك الكامل" required>

<label>📞 رقم الهاتف</label>
<input type="tel" id="phone" placeholder="07XXXXXXXXX" required>

<label>💎 نوع القطعة</label>
<input type="text" id="product" placeholder="خاتم / زنجيل / سوار / ساعة / قلادة" required>

<label>✍️ الحفر الليزري</label>
<input type="text" id="engraving" placeholder="اكتب المطلوب أو: لا يوجد" required>

<label>📍 المحافظة *</label>
<select id="city" required>
  <option value="">اختر المحافظة</option>
  <option value="1">بغداد</option>
  <option value="2">كربلاء</option>
  <option value="3">الأنبار - الرمادي</option>
  <option value="4">الحلة - بابل</option>
  <option value="5">البصرة</option>
  <option value="6">دهوك</option>
  <option value="7">ديالى</option>
  <option value="8">أربيل</option>
  <option value="9">كركوك</option>
  <option value="10">العمارة - ميسان</option>
  <option value="11">السماوة - المثنى</option>
  <option value="12">النجف</option>
  <option value="13">نينوى</option>
  <option value="14">الديوانية - القادسية</option>
  <option value="15">صلاح الدين - تكريت</option>
  <option value="16">السليمانية</option>
  <option value="17">الناصرية - ذي قار</option>
  <option value="18">الكوت - واسط</option>
</select>
<label>📍 المنطقة *</label>
  <input
  type="text"
  id="regionSearch"
  placeholder="🔎 ابحث عن المنطقة..."
  autocomplete="off"
  disabled
>
<select id="region" required disabled>
  <option value="">اختر المحافظة أولاً</option>
</select>
<label>🏠 العنوان بالتفصيل *</label>
<textarea id="address" placeholder="اكتب عنوان التوصيل بالتفصيل" required></textarea>
<label>📌 أقرب نقطة دالة</label>
<input type="text" id="landmark" placeholder="مثال: قرب جامع / سوق / شارع">

<label>💰 السعر</label>
<input type="text" id="price" placeholder="اكتب سعر القطعة" required>

<button type="submit" id="submitBtn">
تثبيت الطلب 💍
</button>

</form>

<div id="result"></div>

<a class="whatsapp" href="https://wa.me/9647514603890" target="_blank">
📞 للاستفسار عبر واتساب: 07514603890
</a>

<div class="footer">
الأمير للفضيات — ثقة وجودة ✨
</div>

</div>

</div>

<script>
  let allRegions = [];
document.getElementById("city").addEventListener("change", function(){

 const cityId = this.value;
const region = document.getElementById("region");
const regionSearch = document.getElementById("regionSearch");

regionSearch.value = "";
regionSearch.disabled = true;
allRegions = [];
  region.innerHTML = '<option value="">جاري تحميل المناطق...</option>';
  region.disabled = true;

  if (!cityId) {
    region.innerHTML = '<option value="">اختر المحافظة أولاً</option>';
    return;
  }

  const oldScript = document.getElementById("regionsScript");
  if (oldScript) oldScript.remove();

  const script = document.createElement("script");
  script.id = "regionsScript";

window.receiveRegions = function(data) {

  allRegions = data || [];

  region.innerHTML = '<option value="">اختر المنطقة</option>';

  if (!allRegions.length) {
    region.innerHTML = '<option value="">لا توجد مناطق</option>';
    return;
  }

  allRegions.forEach(function(item){

    const option = document.createElement("option");

    option.value = item.id;
    option.textContent = item.region_name;

    region.appendChild(option);

  });

  region.disabled = false;
  regionSearch.disabled = false;
};

  script.src =
    "https://script.google.com/macros/s/AKfycbxTepXEeOw0McSTQ2em23gvaD0XlApV3Bp-4ASEV2Z0682yh7TBFqc3UJO_XyMkFDE6Eg/exec" +
    "?action=regions&city_id=" + encodeURIComponent(cityId) +
    "&callback=receiveRegions";

  document.body.appendChild(script);

});
  document.getElementById("regionSearch").addEventListener("input", function(){

  const searchText = this.value.trim().toLowerCase();
  const region = document.getElementById("region");

  const filteredRegions = allRegions.filter(function(item){

    return item.region_name
      .toLowerCase()
      .includes(searchText);

  });

  region.innerHTML = '<option value="">اختر المنطقة</option>';

  if (!filteredRegions.length) {
    region.innerHTML = '<option value="">لا توجد منطقة بهذا الاسم</option>';
    return;
  }

  filteredRegions.forEach(function(item){

    const option = document.createElement("option");

    option.value = item.id;
    option.textContent = item.region_name;

    region.appendChild(option);

  });

});
document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault();

const button=document.getElementById("submitBtn");
const result=document.getElementById("result");

button.disabled=true;
button.innerText="جاري تسجيل الطلب...";

const data={

name:document.getElementById("name").value.trim(),

phone:document.getElementById("phone").value.trim(),

product:document.getElementById("product").value.trim(),

engraving:document.getElementById("engraving").value.trim(),

city:document.getElementById("city").value.trim(),
  region_id:document.getElementById("region").value.trim(),

address:document.getElementById("address").value.trim(),

landmark:document.getElementById("landmark").value.trim(),

price:document.getElementById("price").value.trim()

};

fetch("https://script.google.com/macros/s/AKfycbxTepXEeOw0McSTQ2em23gvaD0XlApV3Bp-4ASEV2Z0682yh7TBFqc3UJO_XyMkFDE6Eg/exec",{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(data)

})

.then(function(){

document.getElementById("orderForm").style.display="none";
  document.querySelector(".subtitle").style.display="none";
document.querySelector(".gold-line").style.display="none";
document.querySelector(".badges").style.display="none";
document.querySelector(".whatsapp").style.display="none";

result.innerHTML=
"✅ تم تسجيل طلبك بنجاح"+
"<br><br>"+
"💍 شكراً لاختياركم الأمير للفضيات ❤️"+
"<br>"+
"✨ نسعد بخدمتكم دائماً ونحرص على تقديم الأفضل لكم."+
"<br><br>"+
"📞 للاستفسار عبر واتساب: "+
"<a href='https://wa.me/9647514603890' target='_blank'>07514603890</a>";

})

.catch(function(error){

button.disabled=false;

button.innerText="تثبيت الطلب 💍";

result.innerText="❌ حدث خطأ، يرجى المحاولة مرة أخرى.";

});

});

</script>

</body>
