<style>
.region-box {
  position: relative;
  width: 100%;
}

#regionInput {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #444;
  border-radius: 8px;
  font-size: 16px;
  background: #111;
  color: #fff;
  text-align: right;
  outline: none;
}

#regionInput:disabled {
  opacity: 0.6;
}

.region-results {
  position: absolute;
  top: 100%;
  right: 0;
  left: 0;
  z-index: 9999;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 0 0 8px 8px;
  max-height: 220px;
  overflow-y: auto;
  display: none;
}

.region-result {
  padding: 12px;
  cursor: pointer;
  border-bottom: 1px solid #eee;
  font-size: 15px;
  color: #222 !important;
  background: #fff !important;
}
.region-result:hover {
  background: #f5f5f5;
}
</style>
<script>
let allRegions = [];

const regionInput = document.getElementById("regionInput");
const regionResults = document.getElementById("regionResults");
const region = document.getElementById("region");

document.getElementById("city").addEventListener("change", function(){

  const cityId = this.value;

  allRegions = [];
  region.value = "";
  regionInput.value = "";
  regionResults.innerHTML = "";
  regionResults.style.display = "none";

  regionInput.disabled = true;

  if (!cityId) {
    regionInput.placeholder = "اختر المحافظة أولاً";
    return;
  }

  regionInput.placeholder = "اختر المنطقة...";

  const oldScript = document.getElementById("regionsScript");
  if (oldScript) oldScript.remove();

  const script = document.createElement("script");
  script.id = "regionsScript";

  window.receiveRegions = function(data) {

    allRegions = data || [];

    if (!allRegions.length) {
      regionInput.disabled = true;
      regionInput.placeholder = "لا توجد مناطق";
      return;
    }

    regionInput.disabled = false;
  };

  script.src =
    "https://script.google.com/macros/s/AKfycbxTepXEeOw0McSTQ2em23gvaD0XlApV3Bp-4ASEV2Z0682yh7TBFqc3UJO_XyMkFDE6Eg/exec" +
    "?action=regions&city_id=" + encodeURIComponent(cityId) +
    "&callback=receiveRegions";

  document.body.appendChild(script);

});

regionInput.addEventListener("input", function(){

  const searchText = this.value.trim().toLowerCase();

  region.value = "";

  const filteredRegions = allRegions.filter(function(item){

    return String(item.region_name)
      .toLowerCase()
      .includes(searchText);

  });

  showRegions(filteredRegions);

});

regionInput.addEventListener("focus", function(){

  if (allRegions.length) {
    showRegions(allRegions);
  }

});

function showRegions(regions) {

  regionResults.innerHTML = "";

  if (!regions.length) {
    regionResults.innerHTML =
      '<div class="region-result">لا توجد منطقة بهذا الاسم</div>';

    regionResults.style.display = "block";
    return;
  }

  regions.forEach(function(item){

    const result = document.createElement("div");

    result.className = "region-result";
    result.textContent = item.region_name;

    result.addEventListener("click", function(){

      regionInput.value = item.region_name;
      region.value = item.id;

      regionResults.innerHTML = "";
      regionResults.style.display = "none";

    });

    regionResults.appendChild(result);

  });

  regionResults.style.display = "block";
}

document.addEventListener("click", function(e){

  if (!e.target.closest(".region-box")) {
    regionResults.style.display = "none";
  }

});
document.getElementById("orderForm").addEventListener("submit",function(e){

e.preventDefault();

const button=document.getElementById("submitBtn");
const result=document.getElementById("result");

button.disabled=true;
button.innerText="جاري تسجيل الطلب...";

const data={

name:document.getElementById("name").value.trim(),

phone:document.getElementById("phone").value.trim(),

product:document.getElementById("product").value.trim(),

engraving:document.getElementById("engraving").value.trim(),

city: document.getElementById("city").options[document.getElementById("city").selectedIndex].text.trim(),

region: document.getElementById("regionInput").value.trim(),
region_id: document.getElementById("region").value.trim(),


landmark:document.getElementById("landmark").value.trim(),

price:document.getElementById("price").value.trim()

};

fetch("https://script.google.com/macros/s/AKfycbxTepXEeOw0McSTQ2em23gvaD0XlApV3Bp-4ASEV2Z0682yh7TBFqc3UJO_XyMkFDE6Eg/exec",{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":"text/plain;charset=utf-8"
},

body:JSON.stringify(data)

})

.then(function(){

document.getElementById("orderForm").style.display="none";
  document.querySelector(".subtitle").style.display="none";
document.querySelector(".gold-line").style.display="none";
document.querySelector(".badges").style.display="none";
document.querySelector(".whatsapp").style.display="none";

result.innerHTML=
"✅ تم تسجيل طلبك بنجاح"+
"<br><br>"+
"💍 شكراً لاختياركم الأمير للفضيات ❤️"+
"<br>"+
"✨ نسعد بخدمتكم دائماً ونحرص على تقديم الأفضل لكم."+
"<br><br>"+
"📞 للاستفسار عبر واتساب: "+
"<a href='https://wa.me/9647514603890' target='_blank'>07514603890</a>";

})

.catch(function(error){

button.disabled=false;

button.innerText="تثبيت الطلب 💍";

result.innerText="❌ حدث خطأ، يرجى المحاولة مرة أخرى.";

});

});

</script>
